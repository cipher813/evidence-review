name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/ms-playwright
          key: quality-${{ runner.os }}-py312-${{ hashFiles('uv.lock') }}
      - name: Locked tools and browser
        run: |
          python -m pip install uv==0.9.5
          uv sync --frozen
          uv run --frozen playwright install --with-deps chromium
      - name: Tests, coverage and reproducible distribution
        run: bash scripts/check.sh
      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file artifacts/runtime-requirements.txt
          uvx --python 3.12 --from pip-audit==2.10.0 pip-audit --strict --require-hashes -r artifacts/runtime-requirements.txt -r build-requirements.txt --format json --output artifacts/dependency-audit.json
      - name: Preserve verification and tested wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-package
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-package
          path: artifacts/
      - name: Publish verified release and measured badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish.sh

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Review</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><h1>Evidence Review</h1><p id="task"></p><label>Assessor <input id="assessor" autocomplete="name"></label><p id="status" role="status" aria-live="polite">Loading…</p></header>
<main><section aria-label="Report"><h2>Report</h2><div id="report"></div><h2>Claims and reference items</h2><div id="subjects"></div></section>
<section aria-label="Evidence"><h2>Evidence</h2><p>Arithmetic and excerpt matching do not establish factual support.</p><div id="evidence"></div><label>Search frozen sources <input type="search" id="search"></label><div id="search-results"></div><details><summary>All frozen sources</summary><div id="sources"></div></details></section>
<section aria-label="Judgments"><h2>Your judgments</h2><div id="forms"></div><h3>Defects</h3><div id="defects"></div><button id="add-defect" type="button">Add defect</button><label>Amendment reason <input id="amendment"></label><button id="submit" type="button">Submit review</button><button id="reconcile" type="button">Reconcile continuation</button><button id="next" type="button">Next task</button></section></main><script src="/app.js" defer></script></body></html>
